appId: com.altixcode.scribezero
name: Transcribe a known recording
---
# The fixture speaks one known sentence, so the transcript can be scored
# against ground truth rather than judged on whether it reads like prose. The
# stub this replaces returned the same four sentences for any input.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Cancel"
- assertVisible: "On-Device Transcribe"
- takeScreenshot: artifacts/01-home

- tapOn: ".*Import External Audio.*"
# "Import External Audio" only opens the import screen; the picker is behind a
# second tap.
- extendedWaitUntil:
    visible: ".*Select Audio File.*"
    timeout: 20000
- takeScreenshot: artifacts/01b-import
- tapOn: ".*Select Audio File.*"
# Wait on chrome only the document picker has. "Files" and "Import" are unsafe
# here: Maestro matches case-insensitively, so a wait on either is satisfied by
# the app's own "Import External Audio" button and returns before the picker
# has presented -- the taps below then land on the home screen and report
# COMPLETED without doing anything.
- extendedWaitUntil:
    visible: ".*(Recents|On My iPhone|Browse).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
# The picker opens on Recents, which is empty on a fresh simulator; the fixture
# lives under On My iPhone.
- runFlow:
    when:
      visible: "No Recents"
    commands:
      - tapOn: "Browse"
      - waitForAnimationToEnd:
          timeout: 6000
      - runFlow:
          when:
            visible: "On My iPhone"
          commands:
            - tapOn: "On My iPhone"
            - waitForAnimationToEnd:
                timeout: 6000
- takeScreenshot: artifacts/02-files
# Tap the thumbnail, not the filename: a tap on the label reports COMPLETED and
# leaves the picker open. The grid holds exactly one file.
- tapOn:
    point: "71,242"

# First transcription must fetch the speech model; the gate states its size and
# that it carries no audio.
- extendedWaitUntil:
    visible: ".*(speech model|Download model).*"
    timeout: 30000
- takeScreenshot: artifacts/03-model-gate
- tapOn: ".*Download model.*"
# "Transcript" is the navigation title, so the previous alternation here passed
# the moment the screen appeared and proved nothing about what was transcribed.
# Wait on words that can only come from the fixture audio.
- extendedWaitUntil:
    visible: ".*quick brown fox.*"
    timeout: 600000
- assertVisible: ".*lazy dog.*"
- takeScreenshot: artifacts/04-transcript
# Copy the transcript so verify-transcript.sh can score the exact text against
# ground truth rather than eyeballing a screenshot.
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 10000
