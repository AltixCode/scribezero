appId: com.altixcode.scribezero
name: Transcribe a known recording
---
# The fixture speaks one known sentence, so the transcript can be scored
# against ground truth rather than judged on whether it reads like prose. The
# stub this replaces returned the same four sentences for any input.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Cancel"
- assertVisible: "On-Device Transcribe"
- takeScreenshot: artifacts/01-home

- tapOn: ".*Import External Audio.*"
# Anchor on the document browser itself. Matching visible text risks returning
# before the picker has presented, which sends the following taps to the app's
# own screen where they report COMPLETED and do nothing.
- extendedWaitUntil:
    visible:
      id: "DOC.browsingView"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: artifacts/02-files
- tapOn: ".*scribe-fixture.*"

# First transcription must fetch the speech model; the gate states its size and
# that it carries no audio.
- extendedWaitUntil:
    visible: ".*(speech model|Download model).*"
    timeout: 30000
- takeScreenshot: artifacts/03-model-gate
- tapOn: ".*Download model.*"
# "Transcript" is the navigation title, so the previous alternation here passed
# the moment the screen appeared and proved nothing about what was transcribed.
# Wait on words that can only come from the fixture audio.
- extendedWaitUntil:
    visible: ".*quick brown fox.*"
    timeout: 600000
- assertVisible: ".*lazy dog.*"
- takeScreenshot: artifacts/04-transcript
# Copy the transcript so verify-transcript.sh can score the exact text against
# ground truth rather than eyeballing a screenshot.
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 10000
